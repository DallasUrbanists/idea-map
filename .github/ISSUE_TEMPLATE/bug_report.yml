name: Bug report
description: You can report a reproducible problem.
title: "Bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: You should describe the observed and expected behavior without personal data or secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: You should include a minimal example, environment, and relevant synthetic data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and context
      description: You should add relevant logs or screenshots after removing private information and credentials.
