name: Feature request
description: You can propose a focused improvement.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
      description: Who needs this and what should improve?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: You should describe observable behavior and how to verify it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Dependencies and context
      description: You should link related work and note relevant constraints.
