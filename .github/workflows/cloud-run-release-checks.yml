name: Cloud Run release checks

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'scripts/cloud-run-release*.mjs'
      - 'scripts/release-ci-gate*.mjs'
      - 'scripts/release-evidence*.mjs'
      - '.github/workflows/*release*.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - 'scripts/cloud-run-release*.mjs'
      - 'scripts/release-ci-gate*.mjs'
      - 'scripts/release-evidence*.mjs'
      - '.github/workflows/*release*.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
      - name: Check Terraform format
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize without a backend
        run: terraform -chdir=infra/terraform init -backend=false -lockfile=readonly
      - name: Validate and run mocked provider tests
        run: |
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform test
      - name: Test release guards
        run: node --test scripts/cloud-run-release.test.mjs scripts/release-ci-gate.test.mjs scripts/release-evidence.test.mjs
      - name: Lint release workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/build-release-images.yml .github/workflows/cloud-run-release.yml \
            .github/workflows/cloud-run-release-checks.yml
