name: Foundational controls

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @idea-map/web exec playwright install --with-deps chromium
      - run: pnpm --filter @idea-map/web test:controls
      - run: pnpm --filter @idea-map/web build:storybook
