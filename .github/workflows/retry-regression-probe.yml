name: Temporary retry regression probe
on:
  push:
    branches: [codex/fix-release-publish-retry]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      archive_name: ${{ steps.archive.outputs.name }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - id: archive
        run: |
          printf 'synthetic retry probe\n' > images.tar
          printf 'sha256=%s\n' "$(sha256sum images.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'name=checked-images-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.archive.outputs.name }}
          path: images.tar
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
      ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
    steps:
      - name: Validate checked archive name
        run: '[[ "$ARCHIVE_NAME" =~ ^checked-images-[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.archive_name }}
      - name: Verify and deliberately fail first attempt
        run: |
          printf '%s  images.tar\n' "$ARCHIVE_SHA256" | sha256sum --check
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then exit 1; fi
