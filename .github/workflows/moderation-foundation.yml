name: Moderation foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: idea_map
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: idea_map_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idea_map -d idea_map_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace checks
        run: |
          pnpm lint
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm test:web
      - name: Provider-fake and authentication checks
        run: |
          pnpm --filter @idea-map/server test:cloud-tasks
          pnpm --filter @idea-map/server test:moderation-schedule
          pnpm --filter @idea-map/worker test
      - name: Create disposable test databases
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_outbox
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_moderation
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_clock
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_history
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_moderator
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_ownership
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_holds
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_legal_holds
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_moderator_decisions
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_moderator_changes
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_moderator_escalations
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_moderation_integrated
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_moderator_removals
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_escalation_transfers
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_database
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_worker
          docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_delivery
      - name: Outbox transactions
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_outbox
        run: pnpm --filter @idea-map/server test:outbox
      - name: Database upgrade and constraints
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_database
        run: pnpm --filter @idea-map/server test:database
      - name: Moderation transactions
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderation
        run: pnpm --filter @idea-map/server test:moderation-jobs
      - name: Moderation with controlled database time
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_clock
        run: pnpm --filter @idea-map/server test:moderation-clock
      - name: Approval history
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_history
        run: pnpm --filter @idea-map/server test:approval-history
      - name: Moderator authorization
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderator
        run: pnpm --filter @idea-map/server test:moderator-authorization
      - name: Verified ownership
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_ownership
        run: pnpm --filter @idea-map/server test:verified-ownership
      - name: Moderator hold races
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_holds
        run: pnpm --filter @idea-map/server test:moderator-holds
      - name: Legal holds and decision retention
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_legal_holds
        run: pnpm --filter @idea-map/server test:legal-holds
      - name: Moderator decision races
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderator_decisions
        run: pnpm --filter @idea-map/server test:moderator-decisions
      - name: Request-changes races
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderator_changes
        run: pnpm --filter @idea-map/server test:moderator-changes
      - name: Moderator escalation races
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderator_escalations
        run: pnpm --filter @idea-map/server test:moderator-escalations
      - name: Combined moderation and recovery
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderation_integrated
        run: pnpm --filter @idea-map/server test:moderation-integrated
      - name: Moderator removal transaction
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderator_removals
        run: pnpm --filter @idea-map/server test:moderator-removals
      - name: Escalation owner transfers
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_escalation_transfers
        run: pnpm --filter @idea-map/server test:escalation-transfers
      - name: Migrate worker test database
        env:
          DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_worker
        run: pnpm --filter @idea-map/server db:migrate
      - name: Worker integration
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_worker
        run: pnpm --filter @idea-map/worker test:integration
      - name: Migrate task delivery test database
        env:
          DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_delivery
        run: pnpm --filter @idea-map/server db:migrate
      - name: Authenticated task delivery with controlled time
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_delivery
        run: pnpm --filter @idea-map/worker test:delivery

  firebase-moderator-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: idea_map
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: idea_map_test_moderator_emulator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idea_map -d idea_map_test_moderator_emulator"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build local Firebase emulators
        run: docker build -f dev/Dockerfile.firebase -t idea-map-firebase-test .
      - name: Start and check Firebase emulators
        run: |
          docker run -d --name idea-map-firebase-test -p 127.0.0.1:9099:9099 -p 127.0.0.1:8080:8080 idea-map-firebase-test
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9099/emulator/v1/projects/demo-idea-map/config >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Firebase emulators did not become ready' >&2
          exit 1
      - name: Build application
        run: pnpm build
      - name: Migrate synthetic database
        env:
          DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderator_emulator
        run: pnpm --filter @idea-map/server db:migrate
      - name: Verify moderator sessions
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_moderator_emulator
        run: pnpm test:moderator-auth
      - name: Prepare ownership test database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U idea_map idea_map_test_ownership_emulator
      - name: Migrate ownership test database
        env:
          DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_ownership_emulator
        run: pnpm --filter @idea-map/server db:migrate
      - name: Verify ownership claims
        env:
          TEST_DATABASE_URL: postgres://idea_map:local-only@127.0.0.1:5432/idea_map_test_ownership_emulator
        run: pnpm test:ownership-claim
      - name: Stop Firebase emulators
        if: always()
        run: docker rm -f idea-map-firebase-test || true
