name: Auth emulator

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm --filter @idea-map/web exec playwright install --with-deps chromium --only-shell
      - run: pnpm dev:services
      - name: Wait for local services
        run: |
          for attempt in {1..60}; do
            if pnpm dev:check; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: pnpm dev:db:migrate
      - run: pnpm build
      - run: pnpm test:auth
      - name: Stop local services
        if: always()
        run: pnpm dev:stop
      - name: Confirm local services stopped
        if: always()
        run: pnpm dev:status
