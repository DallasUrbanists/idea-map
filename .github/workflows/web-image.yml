name: Web image

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/test-web-image.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/web-image.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/test-web-image.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/web-image.yml'

permissions:
  contents: read

jobs:
  local-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f Dockerfile -t idea-map-web:smoke .
      - name: Run isolated smoke checks
        run: scripts/test-web-image.sh idea-map-web:smoke
