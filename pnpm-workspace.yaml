packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@firebase/util': false
  esbuild: true
  protobufjs: false

# Firebase Firestore 4.19.x pins grpc-js 1.9.x. Remove this scoped override
# after upstream adopts a version fixed for GHSA-m9gg-hp2v-232j.
overrides:
  '@firebase/firestore>@grpc/grpc-js': 1.13.6
